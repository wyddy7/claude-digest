name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: digest-bot-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Import check
        run: uv run python -c "import bot; import ai; import scraper; import agent; import db; print('imports OK')"

      - name: Pytest suite (offline, no credentials)
        run: uv run pytest -q

      - name: Scraper test (public, no credentials)
        run: |
          uv run python -c "
          import asyncio
          from scraper import scrape_channel

          async def main():
              posts = await scrape_channel('cryptoEssay', hours_back=48)
              assert isinstance(posts, list), 'Expected list'
              for p in posts:
                  assert p.get('time'), f'Post missing timestamp: {p[\"text\"][:50]}'
              print(f'OK: {len(posts)} posts, all with timestamps')

          asyncio.run(main())
          "

      - name: Offline AI integration tests (no secrets needed)
        run: uv run python test_ai_integration.py

      - name: Full smoke test (requires secrets)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] || [ -z "$OPENROUTER_KEY" ]; then
            echo "Skipping full smoke test: BOT_TOKEN / CHAT_ID / OPENROUTER_KEY secret is missing"
            exit 0
          fi
          uv run test_smoke.py
