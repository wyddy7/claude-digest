[project]
name = "digest-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==21.6",
    "httpx>=0.28.1",
    "beautifulsoup4",
    "openai>=1.54.5",
    "pydantic>=2",
    "python-dotenv",
    "pytz",
    "PyYAML>=6.0",
    "deepagents>=0.1.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "supabase>=2.10.0",
    "trafilatura>=2.0.0",
    "APScheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digest_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
# Logging gate — exactly these three rules, per auto-docs/for-development/logging-errors.md.
# Do NOT widen to the full G/TRY families: they are mostly style, this is a defect gate.
# G004  = f-string in a logging call (loses lazy formatting, invites {e} interpolation)
# TRY400 = logger.error inside except where logger.exception belongs
# TRY401 = exception redundantly interpolated into logger.exception message
select = ["G004", "TRY400", "TRY401"]
