# Reader layer switch (deep-read behind post links). Runtime-controllable —
# change here, no code edit/redeploy needed:
#   off     — headlines only (today's behavior, default)
#   extract — Grade A: one triage call picks links, then fetch + trafilatura
#   agentic — Grade B (NOT IMPLEMENTED; the pipeline raises NotImplementedError)
read_mode: "off"

# Per-stage model registry (OpenRouter model strings).
# Two accepted forms:
#   bare string                 -> model id only (back-compat)
#   mapping {model_id, tier, rationale, task} -> model id + metadata that
#       feeds the bot UI (/stages) and the docs (single source, no drift)
# Change here to switch a stage's model without touching code.
models:
  # Bare-string form (back-compat).
  chat: "anthropic/claude-sonnet-4.6"      # conversational chat agent
  digest: "deepseek/deepseek-chat"         # digest synthesis (overridden by user_state.model at runtime)
  vision: "openai/gpt-4o"                  # image understanding in scraper (not yet wired)

  # Mapping form: cheap deterministic stages with metadata.
  ad_filter:
    model_id: "deepseek/deepseek-chat"
    tier: cheap
    rationale: "High-volume binary classification — cost-sensitive, no synthesis needed."
    task: "Drop pure-ad posts before the digest is synthesized."
  triage:
    model_id: "deepseek/deepseek-chat"
    tier: cheap
    rationale: "One bounded decision over a link list — a cheap model is enough."
    task: "Pick which external links in a post are worth opening (reader layer)."
  summarize_link:
    model_id: "deepseek/deepseek-chat"
    tier: cheap
    rationale: "Reserved for Grade-B per-link summarization; cheap by default."
    task: "Summarize fetched article content (not used in the Grade-A MVP)."

profile:
  description: |
    Replace this with the real user profile on your machine.
    Keep sensitive personal context, user-specific preferences, and durable working notes here.

prompt:
  empty_focus_text: not set
  empty_recent_digest_text: No previous digests.
  style_rules:
    - All output must be in Russian.
    - Write dry, concrete, source-grounded summaries.
    - Prefer useful insight density over hype.
  ad_filter_rules:
    - Ignore pure ads or sales posts without real signal.
    - If a thread starts with an ad but comments contain signal, use only the useful discussion.
  hard_rules:
    - bullets must be short factual lines taken from the source post.
    - example is optional and only for non-trivial concepts.
    - personal must restate source-backed insights in the user's context, not invent new facts.
    - post_date must come from source metadata in DD.MM.YYYY format.
    - url must come from the provided source link.
  source_selection_rules:
    - Select 4-6 of the most informative sources.
    - Skip low-signal posts completely.
    - One source can yield 1-5 factual bullets.
  canonical_examples:
    - |
      channel="cryptoEssay" url="https://t.me/cryptoEssay/2932" post_date="01.04.2026"
      bullets=["AI agents do not retain memory between sessions without external storage", "One-shot examples are not enough for deep model retraining"]
      example="Like waking up every morning with memory reset."
    - |
      channel="ai_newz" url="https://t.me/ai_newz/4500" post_date="31.03.2026"
      bullets=["OpenAI raised a new round to fund data center expansion"]
      example=""
  stop_words:
    - opens horizons
    - critical advantage
    - game changer
    - invest your time
  system_template: |
    You are the editor of a personal AI and tech digest. Write in Russian.

    PROFILE:
    {profile_description}

    CURRENT FOCUS: {focus}

    {recent_digest_block}

    RECENT INTERACTIONS:
    {interaction_history}

    STYLE RULES:
    {style_rules}

    AD FILTER:
    {ad_filter_rules}

    HARD RULES:
    {hard_rules}

    SOURCE SELECTION:
    {source_selection_rules}

    CANONICAL EXAMPLES:
    {canonical_examples}

    STOP WORDS: {stop_words}
